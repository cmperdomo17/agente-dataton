<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniRetail Agent</title>
    <meta
      name="description"
      content="Asistente inteligente de OmniRetail — consulta productos, pedidos y políticas al instante."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0a0a;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.1);
        --border-focus: rgba(255, 255, 255, 0.3);
        --text: #f0f0f0;
        --text-muted: rgba(255, 255, 255, 0.45);
        --accent: #ffffff;
        --btn: rgba(255, 255, 255, 0.12);
        --btn-hover: rgba(255, 255, 255, 0.2);
        --user-bubble: rgba(255, 255, 255, 0.08);
        --agent-bubble: rgba(255, 255, 255, 0.04);
        --radius: 16px;
        --input-radius: 28px;
      }

      html,
      body {
        height: 100%;
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* ── Particles canvas ───────────────────────────── */
      #canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      /* ── Layout ─────────────────────────────────────── */
      #app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100dvh;
        padding: 0 16px;
      }

      /* ── Logo / Header ──────────────────────────────── */
      #header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        padding-top: 15vh;
        padding-bottom: 24px; /* Added separation */
      }

      #header.compact {
        padding-top: 18px;
        padding-bottom: 8px;
      }

      .logo-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 10px;
      }

      .logo-icon {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }

      .logo-icon.small {
        width: 30px;
        height: 30px;
      }

      .logo-title {
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--accent);
        transition: font-size 0.4s ease;
      }

      #header.compact .logo-title {
        font-size: 1.4rem;
      }

      .logo-sub {
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: opacity 0.4s ease;
      }

      #header.compact .logo-sub {
        display: none;
      }

      /* ── Chat history ───────────────────────────────── */
      #chat {
        flex: 1;
        width: 100%;
        max-width: 720px;
        overflow-y: auto;
        padding: 12px 0 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        
        /* ── Scrollbar separado del borde ── */
        scrollbar-gutter: stable;      /* reserva espacio aunque no haya scroll */
        padding-right: 6px;            /* separa contenido del scrollbar */
      }

      /* ── Scrollbar estilizado (webkit) ── */
      #chat::-webkit-scrollbar {
        width: 5px;
      }
      #chat::-webkit-scrollbar-track {
        background: transparent;
        margin-block: 6px;             /* separa arriba y abajo del track */
      }
      #chat::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 99px;
      }
      #chat::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
      }

      #chat:empty {
        display: none;
      }

      .msg {
        display: flex;
        flex-direction: column;
        max-width: 85%;
        animation: fadeUp 0.3s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .msg.agent {
        align-self: flex-start;
        align-items: flex-start;
      }

      .msg-label {
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-bottom: 4px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .msg-bubble {
        padding: 12px 18px;
        border-radius: var(--radius);
        font-size: 0.93rem;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
        
        /* ── Solución cursor flotante ── */
        position: relative;
        padding-right: 12px; /* espacio para que el texto no toque el scrollbar */
      }

      .msg.user .msg-bubble {
        background: var(--user-bubble);
        border: 1px solid var(--border);
        border-bottom-right-radius: 6px;
      }
      .msg.agent .msg-bubble {
        background: var(--agent-bubble);
        border: 1px solid var(--border);
        border-bottom-left-radius: 6px;
      }

      /* ── Typing indicator ───────────────────────────── */
      .typing-dots {
        display: flex;
        gap: 5px;
        padding: 4px 0;
      }
      .typing-dots span {
        width: 6px;
        height: 6px;
        background: var(--text-muted);
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-6px);
          opacity: 1;
        }
      }

      /* ── Input area ─────────────────────────────────── */
      #input-wrap {
        width: 100%;
        max-width: 720px;
        padding: 12px 0 20px;
        flex-shrink: 0;
      }

      #input-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--input-radius);
        padding: 10px 10px 10px 22px;
        transition:
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.3s;
      }

      #input-box:focus-within {
        border-color: var(--border-focus);
        background: var(--surface-hover);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
      }

      #msg-input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 0.97rem;
        line-height: 1.5;
        resize: none;
        max-height: 140px;
        overflow-y: auto;
        scrollbar-width: none;
      }

      #msg-input::placeholder {
        color: var(--text-muted);
      }
      #msg-input::-webkit-scrollbar {
        display: none;
      }

      #send-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--btn);
        border: 1px solid var(--border);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.2s,
          transform 0.15s,
          border-color 0.2s;
      }

      #send-btn:hover:not(:disabled) {
        background: var(--btn-hover);
        border-color: var(--border-focus);
        transform: scale(1.06);
      }

      #send-btn:active {
        transform: scale(0.95);
      }

      #send-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      #send-btn svg {
        pointer-events: none;
      }

      /* ── Footer note ────────────────────────────────── */
      #footer-note {
        font-size: 0.72rem;
        color: var(--text-muted);
        text-align: center;
        padding-bottom: 12px; /* Increased from 6px */
        flex-shrink: 0;
      }

      /* ── Cursor tipo LLM ── */
      .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 0.85em;           /* un poco menos que 1em evita que sobresalga */
        background: currentColor;
        margin-left: 1px;
        vertical-align: middle;   /* ← cambia de text-bottom a middle */
        animation: blink 1s step-end infinite;
        translate: 0 1px;         /* micro-ajuste vertical fino */
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

    #toast {
      position: fixed;
      bottom: 220px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2a0a0a;
      border: 1px solid #5c2020;
      color: #ff8080;
      font-size: 0.82rem;
      padding: 8px 18px;
      border-radius: 12px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes charFade {
      to { opacity: 1; }
    }

    /* ── Metrics style ────────────────────────────── */
    .msg-meta {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 6px;
      opacity: 0;
      animation: charFade 0.5s ease forwards;
    }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── Responsive ─────────────────────────────────── */
      @media (max-width: 600px) {
        .logo-title {
          font-size: 1.8rem;
        }
        #header {
          padding-top: 12vh;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="app">
      <div id="header">
        <div class="logo-wrap">
          <!-- OmniRetail SVG Logo -->
          <svg
            class="logo-icon"
            id="logo-svg"
            viewBox="0 0 44 44"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              width="44"
              height="44"
              rx="12"
              fill="white"
              fill-opacity="0.08"
            />
            <!-- Grid icon: 4 cells representing retail/data -->
            <rect
              x="10"
              y="10"
              width="10"
              height="10"
              rx="2.5"
              fill="white"
              opacity="0.9"
            />
            <rect
              x="24"
              y="10"
              width="10"
              height="10"
              rx="2.5"
              fill="white"
              opacity="0.6"
            />
            <rect
              x="10"
              y="24"
              width="10"
              height="10"
              rx="2.5"
              fill="white"
              opacity="0.6"
            />
            <rect
              x="24"
              y="24"
              width="10"
              height="10"
              rx="2.5"
              fill="white"
              opacity="0.3"
            />
            <!-- Connection dot -->
            <circle cx="22" cy="22" r="2" fill="white" opacity="0.5" />
          </svg>
          <span class="logo-title">OmniRetail Agent</span>
        </div>
        <span class="logo-sub">Asistente inteligente · AWS Bedrock</span>
      </div>

      <div
        id="chat"
        role="log"
        aria-live="polite"
        aria-label="Historial del chat"
      ></div>

      <div id="input-wrap">
        <div id="input-box">
          <textarea
            id="msg-input"
            rows="1"
            placeholder="¿Qué quieres saber?"
            aria-label="Escribe tu mensaje"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button
            id="send-btn"
            aria-label="Enviar mensaje"
            title="Enviar (Enter)"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>

      <div id="footer-note">
        El agente puede cometer errores. Verifica información importante.
      </div>
    </div>

    <div id="toast" role="alert"></div>

    <script>
      // ── Particle Background ──────────────────────────────────────────────
      (function () {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let W,
          H,
          particles = [];
        const COUNT = 90;
        const SPEED = 0.35;
        const MAX_DIST = 130;

        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }

        function mkParticle() {
          return {
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * SPEED,
            vy: (Math.random() - 0.5) * SPEED,
            r: Math.random() * 1.5 + 0.4,
            a: Math.random() * 0.5 + 0.15,
          };
        }

        function init() {
          resize();
          particles = Array.from({ length: COUNT }, mkParticle);
        }

        function draw() {
          ctx.clearRect(0, 0, W, H);

          // Draw lines between close particles
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < MAX_DIST) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255,255,255,${0.06 * (1 - dist / MAX_DIST)})`;
                ctx.lineWidth = 0.6;
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
              }
            }
          }

          // Draw dots
          for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${p.a})`;
            ctx.fill();
          }
        }

        function update() {
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;
            if (p.y < -10) p.y = H + 10;
            if (p.y > H + 10) p.y = -10;
          }
        }

        function loop() {
          update();
          draw();
          requestAnimationFrame(loop);
        }

        window.addEventListener("resize", resize);
        init();
        loop();
      })();

      // ── Chat UI ──────────────────────────────────────────────────────────
      const chatEl = document.getElementById("chat");
      const inputEl = document.getElementById("msg-input");
      const sendBtn = document.getElementById("send-btn");
      const headerEl = document.getElementById("header");
      const logoSvg = document.getElementById("logo-svg");
      const toastEl = document.getElementById("toast");

      let isLoading = false;
      let hasStarted = false;

      // Auto-resize textarea
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
      });

      // Enter to send (Shift+Enter for newline)
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      sendBtn.addEventListener("click", send);

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 4000);
      }

      function addMessage(role, text, elapsed = null) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'Tú' : 'OmniRetail Agent';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;

    if (role === 'user') {
      bubble.textContent = text;
      return bubble;
    } else {
      // Typewriter effect for agent
      return typeText(bubble, text).then(() => {
        if (elapsed !== null) {
          const meta = document.createElement('div');
          meta.className = 'msg-meta';
          meta.textContent = `Respuesta en ${elapsed}s`;
          wrap.appendChild(meta);
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      });
    }
  }

      function typeText(el, text, options = {}) {
        const {
          baseSpeed = 8,
          jitter = 4,
          pauseComma = 40,
          pausePeriod = 70,
          pauseNewline = 100,
        } = options;

        return new Promise((resolve) => {
          const cursor = document.createElement("span");
          cursor.className = "typing-cursor";
          el.appendChild(cursor);

          let i = 0;

          function getDelay(char) {
            const rand = (Math.random() * 2 - 1) * jitter;
            if (char === "\n") return baseSpeed + pauseNewline + rand;
            if (".!?…".includes(char)) return baseSpeed + pausePeriod + rand;
            if (",;:".includes(char)) return baseSpeed + pauseComma + rand;
            if (char === " ") return baseSpeed * 0.8 + rand;
            return baseSpeed + rand;
          }

          function type() {
            if (i < text.length) {
              const char = text.charAt(i);

              if (char === "\n") {
                // ── Insertar <br> ANTES del cursor, sin mover el cursor ──
                // Esto mantiene el cursor siempre pegado al último char real
                cursor.before(document.createElement("br"));
                // ⚠️ NO hacer el.appendChild(cursor) — eso lo baja a línea huérfana
              } else {
                const span = document.createElement("span");
                span.textContent = char;
                cursor.before(span); // cursor siempre se queda al final automáticamente
              }

              i++;
              chatEl.scrollTop = chatEl.scrollHeight;
              setTimeout(type, getDelay(char));
            } else {
              // ── FIN: fade out directo, sin ningún reposicionamiento ──
              // El cursor ya está en la posición correcta (después del último char)
              cursor.style.animation = "none";
              cursor.style.opacity = "1";

              setTimeout(() => {
                cursor.style.transition = "opacity 0.4s ease";
                cursor.style.opacity = "0";
                setTimeout(() => {
                  cursor.remove();
                  resolve(el);
                }, 400);
              }, 500); // parpadea 500ms antes de desaparecer
            }
          }

          type();
        });
      }

      function addTyping() {
        const wrap = document.createElement("div");
        wrap.className = "msg agent";
        wrap.id = "typing-indicator";

        const label = document.createElement("div");
        label.className = "msg-label";
        label.textContent = "OmniRetail Agent";

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";

        const dots = document.createElement("div");
        dots.className = "typing-dots";
        dots.innerHTML = "<span></span><span></span><span></span>";

        bubble.appendChild(dots);
        wrap.appendChild(label);
        wrap.appendChild(bubble);
        chatEl.appendChild(wrap);
        chatEl.scrollTop = chatEl.scrollHeight;
        return wrap; // Return the typing indicator element
      }

      function removeTyping() {
        const el = document.getElementById("typing-indicator");
        if (el) el.remove();
      }

      function collapseHeader() {
        if (!hasStarted) {
          hasStarted = true;
          headerEl.classList.add("compact");
          logoSvg.classList.add("small");
        }
      }

      async function send() {
        const msg = inputEl.value.trim();
        if (!msg || isLoading) return;

        collapseHeader();
        isLoading = true;
        sendBtn.disabled = true;

        // Reset input
        inputEl.value = "";
        inputEl.style.height = "auto";

        // Show user message
        addMessage("user", msg);
        addTyping();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
          });

          const data = await res.json();
          removeTyping();

          if (!res.ok || data.error) {
            showToast(data.error || `Error del servidor (${res.status})`);
          } else {
            addMessage("agent", data.response, data.elapsed);
          }
        } catch (err) {
          removeTyping();
          showToast(
            "No se pudo conectar con el servidor. Verifica tu conexión.",
          );
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      // Focus input on load
      inputEl.focus();
    </script>
  </body>
</html>
